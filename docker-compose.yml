services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: micropeft-backend
    ports:
      - "8000:8000"
    environment:
      - DEVICE=cpu
    command: python -m uvicorn src.inference.app:app --host 0.0.0.0 --port 8000
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: micropeft-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000/v1/generate
    command: streamlit run src/inference/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    depends_on:
      - backend
    restart: always